<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Kullanıcı Girişi</title>
  <link rel="stylesheet" th:href="@{/css/style.css(v='blackwhite-4')}" />
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="hero-panel">
      <div>
        <p class="eyebrow">Task Management System</p>
        <h2>Hoş Geldiniz</h2>
        <p class="login-copy">Devam etmeden önce adınızı, soyadınızı ve e-posta adresinizi girin.</p>
      </div>
    </div>

    <p class="login-note"><strong>Not:</strong> Sadece <strong>Yüksek</strong> öncelikli görevlerinizde e-posta ile hatırlatma alacaksınız.</p>

    <form class="form-panel" th:action="@{/login}" method="post">
      <div class="field">
        <label for="firstName">Ad</label>
        <input type="text" id="firstName" name="firstName" required>
      </div>
      <div class="field">
        <label for="lastName">Soyad</label>
        <input type="text" id="lastName" name="lastName" required>
      </div>
      <div class="field">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" required>
      </div>
      <button type="submit">Devam Et</button>
    </form>
  </section>
</main>

</body>
</html>
